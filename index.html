<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b2019">
<title>纸上山河</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#3a2b20}
canvas{display:block;width:100%;height:100%}
#scene{width:100vw;height:100svh}
#book-loading{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;padding:24px;color:#f8e9c8;background:radial-gradient(ellipse at 50% 40%,#5c4330,#2b2019 75%);font:15px "PingFang SC","Microsoft YaHei",sans-serif;transition:opacity .18s ease}
#book-loading[data-open]{opacity:0;pointer-events:none}
.loading-cover{position:relative;display:grid;place-items:center;width:136px;height:174px;margin:0 auto 32px;border:1px solid #a18054;border-radius:5px 8px 8px 5px;background:linear-gradient(90deg,#1b312a 7%,#507062 8%,#28483d 11%,#233b33);box-shadow:4px 5px 0 #d9c49a,7px 8px 0 #1c3029,12px 17px 29px #21160ebb;transform:rotate(-5deg)}
.loading-cover::before{content:"";position:absolute;inset:11px 10px 11px 19px;border:1px solid #d4b279;border-radius:2px}
.loading-cover h1{margin:0 0 0 8px;writing-mode:vertical-rl;font:700 23px/1 "Songti SC","STSong",serif;letter-spacing:.16em}
#book-status{margin:0}
.loading-line{width:86px;height:2px;margin:14px auto;background:#876950;overflow:hidden}
.loading-line::after{display:block;content:"";width:40%;height:100%;background:#f0d09a;animation:loading 1.5s ease-in-out infinite alternate}
@keyframes loading{from{transform:translateX(0)}to{transform:translateX(150%)}}
#book-retry{border:1px solid #c6a774;border-radius:6px;padding:8px 16px;background:#31241b;color:inherit;font:inherit;cursor:pointer}
#book-loading [hidden]{display:none}
@media(prefers-reduced-motion:reduce){#book-loading{transition:none}.loading-line::after{animation:none;width:100%}}
</style>
</head>
<body>
<div id="scene" inert></div>
<main id="book-loading">
  <div>
    <div class="loading-cover"><h1>纸上山河</h1></div>
    <p id="book-status" role="status">正在准备立体书…</p>
    <div class="loading-line" aria-hidden="true"></div>
    <button id="book-retry" type="button" hidden>重新加载</button>
    <noscript><p>请启用 JavaScript 后打开立体书。</p></noscript>
  </div>
</main>
<script>
(() => {
  const loading = document.querySelector('#book-loading');
  const status = document.querySelector('#book-status');
  const retry = document.querySelector('#book-retry');
  function showRetry() {
    status.textContent = '立体书暂时打不开，可以重新试一次。';
    loading.querySelector('.loading-line').hidden = true;
    retry.hidden = false;
  }
  function handleError(event) {
    if (event.target instanceof HTMLScriptElement || event instanceof ErrorEvent) showRetry();
  }
  const timeout = setTimeout(showRetry, 24000);
  window.addEventListener('error', handleError, true);
  retry.addEventListener('click', () => location.reload());
  window.__showBookAfterFrame = () => {
    delete window.__showBookAfterFrame;
    clearTimeout(timeout);
    window.removeEventListener('error', handleError, true);
    requestAnimationFrame(() => {
      performance.mark('book-cover-ready');
      document.querySelector('#scene').inert = false;
      loading.setAttribute('aria-hidden', 'true');
      loading.dataset.open = '';
      setTimeout(() => loading.remove(), 200);
    });
  };
})();
</script>
<script src="./three.min.js" defer></script>
<script src="./game.min.js?v=f617904cba1b" defer></script>
</body>
</html>
